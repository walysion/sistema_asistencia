version: '3.8'

services:
  asistenciacore-postgres:
    image: postgres:16-alpine
    container_name: asistenciacore-postgres
    environment:
      POSTGRES_DB: AsistenciaDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: PostgresPassword2026!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  asistenciacore-redis:
    image: redis:7-alpine
    container_name: asistenciacore-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  asistenciacore-api:
    build:
      context: ./apps/api/AsistenciaCore.Api
      dockerfile: Dockerfile
    container_name: asistenciacore-api
    ports:
      - "5240:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=asistenciacore-postgres;Database=AsistenciaDb;Username=postgres;Password=PostgresPassword2026!
      - ConnectionStrings__RedisConnection=asistenciacore-redis:6379
      - Jwt__SecretKey=SuperSecretKeySaaSAsistenciaCore2026_EnterpriseMultiTenantAuth
      - Jwt__Issuer=AsistenciaCore.Api
      - Jwt__Audience=AsistenciaCore.Clients
    depends_on:
      asistenciacore-postgres:
        condition: service_healthy
      asistenciacore-redis:
        condition: service_healthy

  asistenciacore-web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: asistenciacore-web
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5240/api
      - NEXT_PUBLIC_SIGNALR_URL=http://localhost:5240/hubs/asistencia
    depends_on:
      - asistenciacore-api

volumes:
  postgres_data: