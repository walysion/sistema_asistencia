version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: asistencia_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword123
      POSTGRES_DB: asistencia_saas
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: asistencia_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data: