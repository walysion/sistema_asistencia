version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: asistenciacore-postgres
    restart: always
    environment:
      POSTGRES_DB: asistencia_saas
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword123
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d asistencia_saas"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: asistenciacore-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api/AsistenciaCore.Api
      dockerfile: Dockerfile
    container_name: asistenciacore-api
    restart: always
    ports:
      - "5240:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=asistencia_saas;Username=admin;Password=adminpassword123
      - ConnectionStrings__Redis=redis:6379
      - Jwt__Secret=ClaveSuperSecretaSaaSAsistencia2026_UltraSecureKey!
      - Jwt__Issuer=AsistenciaCore
      - Jwt__Audience=AsistenciaClients
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: